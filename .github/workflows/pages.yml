# Deploys Scan2Plan to GitHub Pages on every push to main (DEF-08).
# Regenerates src/precache-list.js (file list + content hash) so every change produces a new
# service-worker cache and the installed app shows "Update available — Reload".
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate offline file list and build hash
        run: node tools/gen-precache.mjs
      - name: Collect the static app files
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js icons src vendor _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
